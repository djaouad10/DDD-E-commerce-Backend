name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/djaouad10/ddd-e-commerce-backend:latest
            ghcr.io/djaouad10/ddd-e-commerce-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # when setting up the coolify server, add the following
      # - name: Trigger Coolify deploy
      #   run: |
      #     curl --fail -X POST "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
      #       -H "Authorization: Bearer ${{ secrets.COOLIFY_WEBHOOK_TOKEN }}"
